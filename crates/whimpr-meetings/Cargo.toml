[package]
name = "whimpr-meetings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
whimpr-core = { path = "../whimpr-core" }
whimpr-audio = { path = "../whimpr-audio" }
whimpr-asr = { path = "../whimpr-asr" }
whimpr-media = { path = "../whimpr-media" }
hound = "3.5"
whisper-rs = "0.16"
anyhow = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSString", "NSArray", "NSEnumerator", "NSURL", "NSCalendar", "NSTimeZone", "NSDateFormatter"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKParticipant", "block2"] }
block2 = "0.6"
