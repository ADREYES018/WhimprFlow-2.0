[package]
name = "whimpr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shared, platform-agnostic brain: dictation state machine, session pipeline
# orchestration, ASR/cleanup trait seams, dictionary, settings, storage. The native
# and ML backends plug in behind traits defined here.
[dependencies]
whimpr-ipc = { path = "../whimpr-ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
strsim = "0.11"

# Dev-only, integration-test-only. Cargo permits this cycle (whimpr-cleanup
# depends on whimpr-core normally) because dev-dependencies never apply when
# whimpr-core is built as a library dependency, only when its own tests run.
[dev-dependencies]
whimpr-cleanup = { path = "../whimpr-cleanup" }
